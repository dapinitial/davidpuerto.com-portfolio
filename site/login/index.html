<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Login — David Puerto</title>
  <meta name="robots" content="noindex">
  <meta name="ga-id" content="G-EFR802Z0LM">
  <script src="/boot/arriving.js"></script>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/interior.css">
  <link rel="stylesheet" href="/css/elements/site-header.css">
  <link rel="stylesheet" href="/css/elements/scroll-progress.css">
  <link rel="stylesheet" href="/css/elements/infinity-loader.css">
  <link rel="stylesheet" href="/css/elements/glass-button.css">
  <link rel="stylesheet" href="/css/pages/login.css">
  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/login.js"></script>
</head>

<body>
  <site-header></site-header>
  <main>
    <section class="login-hero dark-section">
      <form class="login-form">
        <p class="lg-eyebrow"><span class="lg-live" aria-hidden="true"></span><span>Case study <span class="lg-sep" aria-hidden="true">//</span> password required</span></p>
        <h1>Login <em>to view</em>.</h1>
        <p class="lg-for" data-for hidden></p>
        <label class="lg-field">
          <span class="lg-label">Password</span>
          <span class="lg-input">
            <input type="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
            <button type="button" class="lg-show" aria-pressed="false" aria-label="Show password">Show</button>
          </span>
        </label>
        <div class="lg-actions">
          <button type="submit" class="glass-button"><span>Login</span></button>
          <p class="form-status" role="alert"></p>
        </div>
        <p class="lg-help">Need the password? <button type="button" class="lg-ask" aria-expanded="false" aria-controls="lg-request">Ask me for it</button> or email <a href="mailto:me@davidpuerto.com?subject=Password%20for%20davidpuerto.com">me@davidpuerto.com</a></p>
      </form>
      <form class="lg-request" id="lg-request" hidden novalidate>
        <p class="lg-request-lead">Leave your name and email. I reply with the password, usually the same day.</p>
        <label class="lg-field"><span class="lg-label">Name</span><span class="lg-input"><input type="text" name="name" autocomplete="name" maxlength="200" placeholder="Who's asking"></span></label>
        <label class="lg-field"><span class="lg-label">Email</span><span class="lg-input"><input type="email" name="from" autocomplete="email" maxlength="200" required placeholder="Where I send it"></span></label>
        <label class="lg-field"><span class="lg-label">A line about why, if you like</span><span class="lg-input"><input type="text" name="note" maxlength="1000" placeholder="Hiring for… / saw your talk at…"></span></label>
        <label class="lg-trap" aria-hidden="true"><input type="text" name="company" tabindex="-1" autocomplete="off"></label>
        <div class="lg-actions">
          <button type="submit" class="glass-button"><span>Send</span></button>
          <p class="form-status" role="status"></p>
        </div>
      </form>
    </section>
    <p class="site-mark"><a href="/since-2004/">&copy; 2004&ndash;<span data-year>2026</span> David A. Puerto</a> <span aria-hidden="true">&middot;</span> <a href="/privacy/">Privacy</a> <span aria-hidden="true">&middot;</span> <a href="/terms/">Terms</a></p>
  </main>
</body>

</html>
