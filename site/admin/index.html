<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analytics — David Puerto</title>
  <meta name="robots" content="noindex">
  <meta name="ga-id" content="">
  <script src="/boot/arriving.js"></script>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/interior.css">
  <link rel="stylesheet" href="/css/elements/site-header.css">
  <link rel="stylesheet" href="/css/elements/scroll-progress.css">
  <link rel="stylesheet" href="/css/elements/infinity-loader.css">
  <link rel="stylesheet" href="/css/pages/admin.css">
  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/admin.js"></script>
</head>

<body>
  <site-header></site-header>
  <main>
    <section class="dark-section admin-dashboard">
      <div class="container">
        <h2>Analytics <em>at a glance</em></h2>

        <div class="range-switcher" role="group" aria-label="Date range">
          <button type="button" data-range="7">7 days</button>
          <button type="button" data-range="28" aria-pressed="true">28 days</button>
          <button type="button" data-range="90">90 days</button>
        </div>

        <p class="dash-status" role="status">crunching…</p>

        <div class="dash-body" hidden>
          <div class="headline-numbers">
            <div class="stat">
              <span class="stat-number" data-stat="users">0</span>
              <span class="stat-label">visitors</span>
            </div>
            <div class="stat">
              <span class="stat-number" data-stat="pageviews">0</span>
              <span class="stat-label">pageviews</span>
            </div>
          </div>

          <figure class="timeline-chart" aria-label="Daily visitors"></figure>

          <div class="dash-grid">
            <section class="dash-list" data-list="sources">
              <h6>Top Sources</h6>
              <ul></ul>
            </section>
            <section class="dash-list" data-list="pages">
              <h6>Top Pages</h6>
              <ul></ul>
            </section>
            <section class="dash-list" data-list="countries">
              <h6>Countries</h6>
              <ul></ul>
            </section>
            <section class="dash-list" data-list="devices">
              <h6>Devices</h6>
              <ul></ul>
            </section>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
