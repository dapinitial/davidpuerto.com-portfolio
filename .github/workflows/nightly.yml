# Every morning (7am Mountain): load the live site in a real browser, confirm
# Google accepts the analytics hit, and confirm GA is recording real visits.
# A failure emails the repo owner the same morning.
name: Nightly live check
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tests
            package.json
            package-lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium-headless-shell
      - name: Live browser smoke test
        run: node tests/smoke.mjs https://davidpuerto.com
      - name: Analytics is recording visits
        env:
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GA_CLIENT_EMAIL: ${{ secrets.GA_CLIENT_EMAIL }}
          GA_PRIVATE_KEY: ${{ secrets.GA_PRIVATE_KEY }}
        run: node tests/ga-health.mjs
