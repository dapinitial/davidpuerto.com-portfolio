<script>
  const DEFINE_URL = 'https://codepen.io/pen/define';
  const data = {"title":"Glass Button — bench","description":"A liquid-glass pill button/CTA: layered translucent gradients, a conic gradient outline ring, and an angular sheen that sweeps on hover. Pure CSS, GPU-friendly, degrades without backdrop-filter. One element: \u003ca class=\"glass-button\">\u003cspan>Label\u003c/span>\u003c/a>.","tags":["control","css-only","glass","button"],"html":"\u003cdiv class=\"wrap\">\n  \u003cheader class=\"masthead\">\n    \u003cp class=\"eyebrow\">component&nbsp;lab &middot; specimen 05\u003c/p>\n    \u003ch1>Glass&nbsp;Button\u003c/h1>\n    \u003cp class=\"sub\">A liquid-glass pill CTA &mdash; pure CSS, GPU-friendly (transform/opacity transitions), and it degrades gracefully without \u003ccode>backdrop-filter\u003c/code>. Edit the label and size live; hover for the sheen sweep.\u003c/p>\n  \u003c/header>\n\n  \u003cdiv class=\"stage\">\n    \u003ca class=\"glass-button\" id=\"gb\" role=\"button\" tabindex=\"0\">\u003cspan id=\"gb-label\">Read Case Study\u003c/span>\u003c/a>\n  \u003c/div>\n\n  \u003cdiv class=\"bench\">\n    \u003clabel class=\"field\">\n      \u003cspan>Label \u003cem>(&lt;span&gt;)\u003c/em>\u003c/span>\n      \u003cinput id=\"label\" type=\"text\" value=\"Read Case Study\" spellcheck=\"false\" autocomplete=\"off\" />\n    \u003c/label>\n    \u003clabel class=\"field field--size\">\n      \u003cspan>Size \u003cem>(font-size)\u003c/em>\u003c/span>\n      \u003cinput id=\"size\" type=\"range\" min=\"0.8\" max=\"2\" step=\"0.05\" value=\"1\" />\n    \u003c/label>\n    \u003cp class=\"prov\">Lifted from \u003cb>davidpuerto.com\u003c/b> &middot; \u003ccode>site/css/elements/glass-button.css\u003c/code>\u003c/p>\n  \u003c/div>\n\u003c/div>","css":"@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');\n  :root {\n    --ground:#08080a; --panel:#101014; --line:#23232a; --ink:#f4f2f5; --muted:#9a9aa6;\n    --dim:#5f5f6a; --accent:#ff6b5e; --glow:rgba(255,107,94,.32);\n    --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;\n  }\n  *{box-sizing:border-box}html,body{margin:0}\n  body{background:var(--ground);color:var(--ink);font-family:var(--mono);-webkit-font-smoothing:antialiased}\n  .wrap{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto}\n  .masthead{padding:clamp(1.4rem,4vw,2.6rem) clamp(1.2rem,4vw,3rem) 0;max-width:64ch}\n  .eyebrow{margin:0 0 .9rem;font-size:.72rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}\n  .masthead h1{margin:0;font-weight:600;font-size:clamp(1.6rem,4vw,2.4rem);letter-spacing:-.01em}\n  .masthead .sub{margin:.8rem 0 0;color:var(--muted);font-size:.92rem;line-height:1.65}\n  code{color:var(--ink);background:#17171c;padding:.08em .4em;border-radius:.3em;font-size:.88em}\n\n  /* Stage: a soft colored pool so the glass's blur + translucency actually read. */\n  .stage{\n    position:relative;display:grid;place-items:center;overflow:hidden;\n    padding:clamp(2rem,7vw,5rem) clamp(1.2rem,4vw,3rem);\n    background:\n      radial-gradient(40% 60% at 32% 38%, #5b3aa6 0%, transparent 60%),\n      radial-gradient(45% 55% at 70% 68%, #b0455e 0%, transparent 62%),\n      #0b0b10;\n  }\n  .stage::before{ /* faint grid so the blur is visible through the glass */\n    content:\"\";position:absolute;inset:0;pointer-events:none;opacity:.5;\n    background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);\n    background-size:34px 34px;\n  }\n  #gb{position:relative;z-index:1}\n  #gb span{font-size:var(--gb-size,1rem)}\n\n  /* Bench controls */\n  .bench{display:flex;flex-wrap:wrap;align-items:flex-start;gap:clamp(1rem,3vw,1.8rem);\n    padding:clamp(1.1rem,3vw,1.6rem) clamp(1.2rem,4vw,3rem);background:var(--panel);border-top:1px solid var(--line)}\n  .field{display:flex;flex-direction:column;gap:.45rem;min-width:12rem;flex:1 1 12rem}\n  .field--size{flex:0 0 14rem}\n  .field>span{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}\n  .field em{color:var(--dim);font-style:normal;text-transform:none;letter-spacing:0}\n  input[type=text]{font-family:var(--mono);font-size:.95rem;color:var(--ink);background:#17171c;border:1px solid var(--line);border-radius:.5rem;padding:.6rem .75rem;width:100%}\n  input[type=text]:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}\n  input[type=range]{width:100%;accent-color:var(--accent);margin-top:.6rem}\n  .prov{flex:1 1 100%;margin:.2rem 0 0;color:var(--dim);font-size:.74rem}\n  .prov b{color:var(--muted);font-weight:600}\n\n  /* ---- .glass-button component (inlined) ---- */\n    /* .glass-button — liquid-glass pill CTA (dark-theme adaptation of the\n       classic glass button). Single element, no wrappers:\n    \n         \u003ca class=\"glass-button\" href=\"...\">\u003cspan>Read Case Study\u003c/span>\u003c/a>\n    \n       Pure CSS, GPU-friendly (transform/opacity/background-position transitions).\n       Degrades gracefully without backdrop-filter. */\n    \n    .glass-button {\n      --border-width: clamp(1px, 0.0625em, 4px);\n      --anim-time: 400ms;\n      --anim-ease: cubic-bezier(0.25, 1, 0.5, 1);\n    \n      all: unset;\n      cursor: pointer;\n      position: relative;\n      display: inline-block;\n      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);\n      border-radius: 999vw;\n      background: linear-gradient(\n        -75deg,\n        rgba(255, 255, 255, 0.04),\n        rgba(255, 255, 255, 0.14),\n        rgba(255, 255, 255, 0.04)\n      );\n      box-shadow:\n        inset 0 0.125em 0.125em rgba(0, 0, 0, 0.25),\n        inset 0 -0.125em 0.125em rgba(255, 255, 255, 0.25),\n        0 0.25em 0.4em -0.125em rgba(0, 0, 0, 0.5),\n        0 0 0.1em 0.25em inset rgba(255, 255, 255, 0.12);\n      backdrop-filter: blur(clamp(1px, 0.125em, 4px));\n      -webkit-backdrop-filter: blur(clamp(1px, 0.125em, 4px));\n      transition: transform var(--anim-time) var(--anim-ease),\n        box-shadow var(--anim-time) var(--anim-ease);\n    }\n    \n    .glass-button:hover {\n      transform: scale(0.975);\n      box-shadow:\n        inset 0 0.125em 0.125em rgba(0, 0, 0, 0.25),\n        inset 0 -0.125em 0.125em rgba(255, 255, 255, 0.35),\n        0 0.15em 0.3em -0.1em rgba(0, 0, 0, 0.6),\n        0 0 0.05em 0.1em inset rgba(255, 255, 255, 0.25);\n    }\n    \n    .glass-button:active {\n      transform: scale(0.95);\n    }\n    \n    /* Label */\n    .glass-button span {\n      position: relative;\n      display: block;\n      user-select: none;\n      -webkit-user-select: none;\n      font-weight: 500;\n      font-size: 1rem;\n      letter-spacing: -0.02em;\n      color: rgba(255, 255, 255, 0.92);\n      text-shadow: 0 0.12em 0.12em rgba(0, 0, 0, 0.35);\n      padding-inline: 1.5em;\n      padding-block: 0.75em;\n      transition: text-shadow var(--anim-time) var(--anim-ease);\n    }\n    \n    .glass-button:hover span {\n      text-shadow: 0 0.025em 0.025em rgba(0, 0, 0, 0.2);\n    }\n    \n    /* Shine sweep across the face — band parks fully off-canvas at rest\n       (stops pushed past the visible window) so no glint smears the edge. */\n    .glass-button span::after {\n      content: '';\n      display: block;\n      position: absolute;\n      z-index: 1;\n      width: calc(100% - var(--border-width));\n      height: calc(100% - var(--border-width));\n      top: calc(0% + var(--border-width) / 2);\n      left: calc(0% + var(--border-width) / 2);\n      box-sizing: border-box;\n      border-radius: 999vw;\n      overflow: clip;\n      background: linear-gradient(\n        -45deg,\n        rgba(255, 255, 255, 0) 0%,\n        rgba(255, 255, 255, 0.25) 55% 60%,\n        rgba(255, 255, 255, 0) 68%\n      );\n      mix-blend-mode: screen;\n      pointer-events: none;\n      background-size: 200% 200%;\n      background-position: 0% 50%;\n      background-repeat: no-repeat;\n      transition: background-position calc(var(--anim-time) * 1.25) var(--anim-ease);\n    }\n    \n    .glass-button:hover span::after {\n      background-position: 25% 50%;\n    }\n    \n    .glass-button:active span::after {\n      background-position: 50% 15%;\n    }\n    \n    /* Gradient outline ring */\n    .glass-button::after {\n      content: '';\n      position: absolute;\n      z-index: 1;\n      inset: 0;\n      border-radius: 999vw;\n      width: calc(100% + var(--border-width));\n      height: calc(100% + var(--border-width));\n      top: calc(0% - var(--border-width) / 2);\n      left: calc(0% - var(--border-width) / 2);\n      padding: var(--border-width);\n      box-sizing: border-box;\n      background: conic-gradient(\n          from -75deg at 50% 50%,\n          rgba(255, 255, 255, 0.5),\n          rgba(255, 255, 255, 0) 5% 40%,\n          rgba(255, 255, 255, 0.5) 50%,\n          rgba(255, 255, 255, 0) 60% 95%,\n          rgba(255, 255, 255, 0.5)\n        ),\n        linear-gradient(180deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.3));\n      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);\n      mask-composite: exclude;\n      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);\n      -webkit-mask-composite: xor;\n      pointer-events: none;\n      box-shadow: inset 0 0 0 calc(var(--border-width) / 2) rgba(255, 255, 255, 0.35);\n    }\n    \n    .glass-button:focus-visible {\n      outline: 2px solid rgba(255, 255, 255, 0.7);\n      outline-offset: 3px;\n    }","js":"const gb = document.getElementById('gb');\n  const labelEl = document.getElementById('gb-label');\n  const labelInput = document.getElementById('label');\n  const sizeInput = document.getElementById('size');\n  labelInput.addEventListener('input', () => { labelEl.textContent = labelInput.value || ' '; });\n  sizeInput.addEventListener('input', () => { gb.style.setProperty('--gb-size', sizeInput.value + 'rem'); });\n  gb.addEventListener('click', (e) => e.preventDefault());","editors":"111"};
  document.getElementById('go').addEventListener('click', () => {
    const form = document.createElement('form');
    form.action = DEFINE_URL; form.method = 'POST'; form.target = '_blank';
    const input = document.createElement('input');
    input.type = 'hidden'; input.name = 'data';
    input.value = JSON.stringify(data);
    form.appendChild(input);
    document.body.appendChild(form);
    form.submit();
    form.remove();
  });
</script>
