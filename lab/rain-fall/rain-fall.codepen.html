<body>
<div class="card">

  <small>Then hit <b>Save</b> in CodePen (log in first).</small>

<script>
  const DEFINE_URL = 'https://codepen.io/pen/define';
  const data = {"title":"Rain Fall","description":"A light-DOM web component that rains: falling drips with splash rings, spawned on rAF up to `max-drips`. Respects reduced-motion. Zero deps, no images.","tags":["ambient","effect","web-component","vanilla-js"],"html":"\u003crain-fall fullpage max-drips=\"26\">\u003c/rain-fall>","css":"/* stage — matches the standalone baseline */\n*, *::before, *::after { box-sizing: border-box; }\nhtml, body { margin: 0; }\nbody { min-height: 100dvh; display: grid; place-items: center; background: #0b0b0e; padding: 8vmin; }\n\n/* \u003crain-fall> — flattened from rain.module.css.\n   Default: section-scale drips. With [fullpage]: viewport-scale drips. */\n\nrain-fall {\n  display: block;\n  position: absolute;\n  top: -30px;\n  left: 0;\n  width: 100%;\n  height: 100%;\n  pointer-events: none;\n  overflow: hidden;\n  z-index: 0;\n}\n\nrain-fall[fullpage] {\n  bottom: 0;\n  height: 100vh;\n}\n\nrain-fall .drip {\n  width: 200px;\n  height: 250px;\n  position: absolute;\n  will-change: transform;\n  transform: translate3d(0, 0, 0);\n  backface-visibility: hidden;\n}\n\nrain-fall[fullpage] .drip {\n  height: 65vh;\n}\n\n/* Falling drop */\nrain-fall .drip::before {\n  position: absolute;\n  content: '';\n  width: 15px;\n  height: 15px;\n  background-color: rgba(255, 255, 255, 0.2);\n  border-radius: 50%;\n  opacity: 0;\n  animation: rain-drip 4s ease infinite;\n}\n\nrain-fall[fullpage] .drip::before {\n  animation-name: rain-drip-fullpage;\n}\n\n/* Splash ring */\nrain-fall .drip::after {\n  box-sizing: border-box;\n  position: absolute;\n  bottom: 0;\n  left: 0;\n  content: '';\n  width: 0;\n  height: 0;\n  border: solid 4px rgba(255, 255, 255, 0.2);\n  border-radius: 50%;\n  opacity: 0;\n  animation: rain-splash 4s ease infinite;\n}\n\n@keyframes rain-drip {\n  10% { top: 0; opacity: 0.99; animation-timing-function: cubic-bezier(0.24, 0, 0.76, 0.14); }\n  25% { opacity: 0.99; top: 200px; animation-timing-function: ease-out; width: 15px; height: 15px; left: 92.5px; }\n  30% { opacity: 0.99; top: 160px; width: 5px; height: 5px; animation-timing-function: ease-in; left: 97.5px; }\n  33% { top: 200px; opacity: 0; animation-timing-function: ease-out; left: 97.5px; }\n  33.001% { opacity: 0; }\n  100% { opacity: 0; }\n}\n\n@keyframes rain-drip-fullpage {\n  10% { top: 0; opacity: 0.99; animation-timing-function: cubic-bezier(0.24, 0, 0.76, 0.14); }\n  25% { opacity: 0.99; top: 58vh; animation-timing-function: ease-out; width: 15px; height: 15px; left: 92.5px; }\n  30% { opacity: 0.99; top: 40vh; width: 5px; height: 5px; animation-timing-function: ease-in; left: 97.5px; }\n  33% { top: 65vh; opacity: 0; animation-timing-function: ease-out; left: 97.5px; }\n  33.001% { opacity: 0; }\n  100% { opacity: 0; }\n}\n\n@keyframes rain-splash {\n  0% { opacity: 0; }\n  25% { bottom: 50px; left: 100px; opacity: 0; width: 0; height: 0; }\n  25.001% { opacity: 0.4; }\n  33% { bottom: 0; left: 0; opacity: 0; width: 200px; height: 100px; }\n  33.001% { bottom: 50px; left: 100px; opacity: 0.6; width: 0; height: 0; }\n  43% { bottom: 0; left: 0; opacity: 0; width: 200px; height: 100px; }\n  43.001% { opacity: 0; }\n}\n","js":"// \u003crain-fall> — ambient falling drips with splash rings.\n//   \u003crain-fall>\u003c/rain-fall>                    section-scale rain\n//   \u003crain-fall fullpage max-drips=\"20\">\u003c/rain-fall>   full-viewport rain\n// Light DOM, zero deps. Pair with css/elements/rain-fall.css.\n\nclass RainFall extends HTMLElement {\n  #raf;\n  #lastDrip = 0;\n\n  connectedCallback() {\n    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    this.#raf = requestAnimationFrame(this.#tick);\n  }\n\n  disconnectedCallback() {\n    cancelAnimationFrame(this.#raf);\n    this.replaceChildren();\n  }\n\n  get maxDrips() {\n    return Number(this.getAttribute('max-drips') ?? 20);\n  }\n\n  #tick = (timestamp) => {\n    const interval = 300 + Math.random() * 300;\n    if (this.childElementCount \u003c this.maxDrips && timestamp - this.#lastDrip > interval) {\n      const drip = document.createElement('div');\n      drip.className = 'drip';\n      drip.style.left = `${Math.random() * 100}%`;\n      drip.style.animationDelay = `${Math.random() * 3}s`;\n      this.append(drip);\n      setTimeout(() => drip.remove(), 4000);\n      this.#lastDrip = timestamp;\n    }\n    this.#raf = requestAnimationFrame(this.#tick);\n  };\n}\n\ncustomElements.define('rain-fall', RainFall);\n","editors":"111"};
  document.getElementById('go').addEventListener('click', () => {
    const form = document.createElement('form');
    form.action = DEFINE_URL; form.method = 'POST'; form.target = '_blank';
    const input = document.createElement('input');
    input.type = 'hidden'; input.name = 'data';
    input.value = JSON.stringify(data);
    form.appendChild(input);
    document.body.appendChild(form);
    form.submit();
    form.remove();
  });
</script>
