# shipmate project settings — read by the pre-push guard, preflight and the live check
# (skills/deploy/lib/project.sh in the shipmate repo documents every key)
deploy_remote: origin
branch: main
max_files: 40
health_url: https://davidpuerto.com
protected:
  - site/case-studies/apple/
  - site/case-studies/microsoft/
  - site/case-studies/facebook/
  - site/case-studies/nordstrom/
  - site/case-studies/sonosite/
  - site/case-studies/zillow/
# Build output committed on purpose: `npm run lock` encrypts the built bundle, and a rebuild
# renames its content-hashed chunks, so a relock typically rewrites ~280 files. That churn
# doesn't count toward max_files (authored changes since Oct 10: max 28 files per commit);
# it is still checked against protected.
generated:
  - content-locked/

# site-hardening live check (the sentinel runs it; see ~/.claude/skills/site-hardening)
security_form: /api/contact
security_resolve: svpqolfcjbujzmngabjg.supabase.co
security_mail: davidpuerto.com
